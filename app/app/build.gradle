apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'   // ✅ instead of old annotationProcessor

repositories {
    maven { url 'https://jitpack.io' }
    mavenCentral()
    google()
    maven { url "https://raw.github.com/psiegman/mvn-repo/master/releases/" }
    flatDir {
        dirs '../libs'
    }
}

android {
    namespace "com.sigizmund.epubmergeapp"   // ✅ REQUIRED

    compileSdk 34

    defaultConfig {
        applicationId "com.sigizmund.epubmergeapp"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner" // ✅ FIXED
    }

    signingConfigs {
        release {
            storeFile System.getenv("KEYSTORE") ? file(System.getenv("KEYSTORE")) : null
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            java {
                srcDirs('src/main/java', '../../epubmergelib/src') // ✅ fixed path
            }
        }
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation fileTree(dir: '../libs', include: ['*.jar', '*.aar'])

    // ✅ Updated core libs
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

    // ✅ lifecycle updated
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'

    // ❌ REMOVE old lifecycle + annotationProcessor

    // EPUB
    implementation('nl.siegmann.epublib:epublib-core:3.1') {
        exclude group: 'org.slf4j'
        exclude group: 'xmlpull'
    }

    implementation 'org.slf4j:slf4j-android:1.7.36'
    implementation 'com.github.angads25:filepicker:1.1.1'
    implementation 'com.github.fondesa:kpermissions:3.3.0'
    implementation 'org.jsoup:jsoup:1.17.2'

    testImplementation 'junit:junit:4.13.2'
}